[package]
name = "bevytiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Geo-spatial terrain streaming engine for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ziv/bevytiles"
readme = "README.md"
keywords = ["bevy", "terrain", "gis", "streaming", "heightmap"]
categories = ["game-development", "rendering"]

[dependencies]
bevy = { version = "0.19", features = ["bevy_dev_tools"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.5"
# transitive; the `js` feature is required for wasm32-unknown-unknown
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"

# dev builds of bevy are unusably slow without optimized deps
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[[example]]
name = "demo"

# web bundle: LTO + stripped, used by web/build.sh (slow to build, much smaller)
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

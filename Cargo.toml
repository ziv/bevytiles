[package]
name = "bevytiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Geo-spatial terrain streaming engine for Bevy — a port of raytiles"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ziv/bevytiles"
readme = "README.md"
keywords = ["bevy", "terrain", "gis", "streaming", "heightmap"]
categories = ["game-development", "rendering"]

[dependencies]
bevy = "0.19"  # see the compatibility table in README.md
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = "2"

[dev-dependencies]
tempfile = "3"

# dev builds of bevy are unusably slow without optimized deps
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[[example]]
name = "demo"
